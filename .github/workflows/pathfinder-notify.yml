name: Pathfinder Notification Relay

on:
  issues:
    types: [opened]

jobs:
  notify:
    if: contains(github.event.issue.labels.*.name, 'pathfinder')
    runs-on: ubuntu-latest
    steps:
      - name: Assign and ping
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              assignees: ['chrisrileyy91-gif']
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '📱 @chrisrileyy91-gif — Your Pathfinder daily report is ready for review.'
            });
